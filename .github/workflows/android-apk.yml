name: Android APK

on:
  workflow_dispatch:  # ejecución manual desde la pestaña Actions
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android-apk.yml"

# Solo lectura: este workflow no escribe en el repositorio.
permissions:
  contents: read

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos de la app
        run: |
          for f in android/settings.gradle.kts android/app/build.gradle.kts \
                   android/app/debug.keystore android/app/src/main/AndroidManifest.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta $f. Ejecuta antes el workflow 'Agregar app Android'."
              exit 1
            fi
          done

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Pruebas unitarias
        working-directory: android
        run: gradle testDebugUnitTest --stacktrace

      - name: Compilar APK
        working-directory: android
        run: gradle assembleDebug -PversionCode=${{ github.run_number }} --stacktrace

      - name: Preparar el APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Pronostico-Nogoya.apk

      - name: Publicar APK como Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Pronostico-Nogoya-APK
          path: Pronostico-Nogoya.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publicar informe de pruebas si algo falló
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: informe-pruebas-android
          path: android/app/build/reports/tests
          if-no-files-found: ignore
