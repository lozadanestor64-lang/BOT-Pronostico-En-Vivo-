name: Pron贸stico Nogoy谩 En Vivo

on:
  schedule:
    # GitHub usa UTC. Argentina es UTC-3 todo el a帽o: corre a las
    # 21, 00, 03, 06, 09, 12, 15 y 18 h de Argentina (puede demorar unos minutos).
    - cron: "0 */3 * * *"
  workflow_dispatch:  # ejecuci贸n manual desde la pesta帽a Actions

# Permisos m铆nimos: solo escribir contenido (para commitear latest.txt e historial).
permissions:
  contents: write

# Evita ejecuciones solapadas que pisen el mismo archivo.
concurrency:
  group: pronostico-nogoya
  cancel-in-progress: false

jobs:
  pronostico:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Verificar archivos del proyecto
        run: |
          faltan=0
          for f in requirements.txt requirements-dev.txt pyproject.toml \
                   src/pronostico_nogoya/__main__.py tests/conftest.py; do
            if [ ! -f "$f" ]; then
              echo "::error::Falta $f en la ra铆z del repositorio"
              faltan=1
            fi
          done
          if [ "$faltan" = 1 ]; then
            echo "Contenido de la ra铆z del repositorio:"
            ls -la
            echo "Ubicaciones de pyproject.toml encontradas:"
            find . -maxdepth 3 -name pyproject.toml -not -path "./.git/*" || true
            echo "::error::Sube el CONTENIDO de la carpeta del proyecto a la RA脥Z del repositorio (no el ZIP ni una subcarpeta)."
            exit 1
          fi

      - name: Instalar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt

      - name: Ejecutar pruebas
        run: python -m pytest

      - name: Generar pron贸stico
        id: bot
        # Si falla, el bot deja en latest.txt un aviso "NO PUBLICAR" y
        # igual se commitea, para que no quede informaci贸n vieja como actual.
        continue-on-error: true
        run: python -m pronostico_nogoya

      - name: Actualizar latest.txt e historial
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.txt historial
          if git diff --cached --quiet; then
            echo "Sin cambios que commitear."
          else
            git commit -m "Pron贸stico Nogoy谩: $(TZ=America/Argentina/Cordoba date +'%Y-%m-%d %H:%M')"
            git push
          fi

      - name: Marcar la ejecuci贸n como fallida si el bot fall贸
        if: steps.bot.outcome == 'failure'
        run: |
          echo "::error::No se pudo generar un pron贸stico confiable; latest.txt contiene un aviso."
          exit 1
