[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pronostico-nogoya"
version = "1.0.0"
description = "Genera el pronóstico de Nogoyá en texto para copiar y publicar manualmente."
requires-python = ">=3.12"
dependencies = ["requests>=2.31,<3", "tzdata>=2024.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
